# Logger module
CONFIG_LOG=y


# Formatowanie float w logach
CONFIG_CBPRINTF_FP_SUPPORT=y

# BLE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Node Friend"
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y

# BLE Mesh
CONFIG_BT_MESH=y

# Bearer PB-ADV: Friend prowadzi provisioning LPN przez powietrze.
CONFIG_BT_MESH_PB_ADV=y

# Rola Provisioner: Friend provisionuje i konfiguruje LPN. Wymaga CDB
# (Configuration Database), ktora trzyma provisionowane wezly, ich DevKey
# oraz AppKey do dystrybucji. CDB zyje w RAM (BT_SETTINGS=n).
# NODE_COUNT=2: jeden slot zajmuje sam Friend (self-provision @ 0x0001),
# drugi jest na LPN (@ 0x0002) - przy 1 provisioning LPN konczy sie bledem
# "Failed allocating node".
CONFIG_BT_MESH_PROVISIONER=y
CONFIG_BT_MESH_CDB=y
CONFIG_BT_MESH_CDB_NODE_COUNT=2

# Config Client
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_HEALTH_CLI=y

# Sensor Client
CONFIG_BT_MESH_SENSOR_CLI=y

# Friend
CONFIG_BT_MESH_FRIEND=y
CONFIG_BT_MESH_FRIEND_LPN_COUNT=2

# Limity sieci
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_GROUP_COUNT=2

# Trwalosc wylaczona (nie zapisujemy do flasha)
CONFIG_BT_SETTINGS=n

# Liczniki komunikacji stosu (rx_adv, tx_friend_*, tx_local_*) - zrzucane
# cyklicznie w logu (stat_dump_work). Diagnostyka dostarczania do LPN.
CONFIG_BT_MESH_STATISTIC=y

# Tuning stosow i buforow
CONFIG_MAIN_STACK_SIZE=4400
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4800
CONFIG_BT_MESH_ADV_STACK_SIZE=4000
CONFIG_BT_RX_STACK_SIZE=3300
CONFIG_BT_MESH_ADV_BUF_COUNT=10

# Segmentacja
CONFIG_BT_MESH_RX_SEG_MAX=32
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=3

# SAR TX (Mesh 1.1): cierpliwosc nadawcy segmentow na adres unicast. Konfiguracja
# LPN (segmentowany AppKey Add) idzie do sypiajacego wezla przez Friend Poll,
# wiec Segment ACK wraca z opoznieniem setek ms do sekund. Domyslne wartosci
# (~2 proby "bez postepu", ~0.5 s) sa za nerwowe i daja "Ran out of retransmit
# without progress" -> ETIMEDOUT. Podbijamy liczbe prob i wydluzamy interwaly.
# WITHOUT_PROG_COUNT: ile razy retransmitowac bez ZADNEGO Segment ACK (0x0F=15).
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_WITHOUT_PROG_COUNT=0x0f
# RETRANS_COUNT: calkowity limit retransmisji (0x07=7).
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_COUNT=0x07
# Interwal miedzy retransmisjami: (STEP+1)*25 ms = 400 ms; +(INC+1)*25 ms co proba.
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_INT_STEP=0x0f
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_INT_INC=0x0f
