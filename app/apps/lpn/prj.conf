# Logger (DEBUG: wlaczony na czas diagnozy provisioningu/konfiguracji)
CONFIG_LOG=y

# Formatowanie liczb zmiennoprzecinkowych w logach - wymagane przez
# bt_mesh_sensor_ch_str() (inaczej log pokazuje "*float*").
CONFIG_CBPRINTF_FP_SUPPORT=y

# BLE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="LPN Node"
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y

# Provisioning REALNY: wezel wystawia unprovisioned beacon przez PB-ADV
# (bt_mesh_prov_enable w main.c) i czeka, az Friend (provisioner) rozda mu
# NetKey, adres i DevKey oraz zdalnie skonfiguruje modele.
CONFIG_BT_MESH=y
CONFIG_BT_MESH_PB_ADV=y

# LPN
CONFIG_BT_MESH_LOW_POWER=y
CONFIG_BT_MESH_LPN_POLL_TIMEOUT=600
CONFIG_BT_MESH_RELAY=n
CONFIG_BT_MESH_FRIEND=n

# Nawiazywanie friendship PELNYM cyklem skanowania (domyslnie zredukowanym).
CONFIG_BT_MESH_LPN_ESTABLISHMENT=n

# Auto-LPN WYLACZONE. Wezel w trybie LPN z zasady NIE odsyla Segment ACK ("Not
# sending ack when LPN is enabled"), wiec segmentowanej konfiguracji (AppKey Add)
# NIE da sie do niego dostarczyc. Dlatego LPN zostaje pelnym, skanujacym wezlem
# przez caly czas konfiguracji, a w tryb LPN wchodzi RECZNIE (bt_mesh_lpn_set)
# dopiero PO wykryciu, ze Friend go skonfigurowal (patrz main.c).
CONFIG_BT_MESH_LPN_AUTO=n

# Sensor Server - publikuje/udostepnia odczyty czujnikow przez mesh.
# Pociaga za soba BT_MESH_SENSOR (typy i kodowanie wartosci). Jeden czujnik
# (temperatura), wiec limit tablicy = 1.
CONFIG_BT_MESH_SENSOR_SRV=y
CONFIG_BT_MESH_SENSOR_SRV_SENSORS_MAX=1

# Wezel BEZSTANOWY: mesh nie zapisuje ani nie wczytuje provisioningu. Przy
# kazdym starcie wezel od nowa self-provisionuje sie na staly adres ze stalymi
# kluczami (hardcoded w main.c) - stan sieci jest zawsze taki sam, bez erase.
CONFIG_BT_SETTINGS=n

# Infrastrukture settings/flash/ZMS ZOSTAWIAMY: na nRF54L PSA Internal Trusted
# Storage (default y) potrafi wymagac backendu store nawet bez BT_SETTINGS.
# Bez tego wraca blad linkera storage_*_object. Mesh i tak nic nie zapisuje
# (to reguluje BT_SETTINGS=n), wiec stan sieci nie przetrwa restartu. Backend
# ZMS jest w boards/BTZ_EndDevice_nrf54l15_cpuapp.conf.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# limits
CONFIG_MAIN_STACK_SIZE=4400
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4800
CONFIG_BT_MESH_RX_SEG_MAX=32
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=3

# --- Niezawodnosc odbioru segmentowanej konfiguracji (AppKey Add) ---
# LPN jest ODBIORCA segmentow. Domyslne wartosci SAR RX gubily konfiguracje:
#  * ACK_RETRANS_COUNT=0 -> Segment ACK wysylany RAZ; zgubiony w eterze =>
#    Friend nie widzi postepu i konczy "Ran out of retransmit attempts".
#  * DISCARD_TIMEOUT=0x01 (~10 s) -> niekompletny SDU odrzucany, zanim Friend
#    dokonczy retransmisje => "SAR Discard timeout expired" + "canceled SDU".
# Podbijamy retransmisje ACK i wydluzamy discard, by odbior domkniecie mial czas.
# SEG_THRESHOLD=0x01: nasz AppKey Add ma 2 segmenty, a retransmisja ACK dziala
# tylko gdy liczba segmentow > SEG_THRESHOLD. Domyslne 0x03 (3) blokowaloby ja
# dla 2-segmentowej wiadomosci - dlatego obnizamy prog do 1 (2 > 1).
CONFIG_BT_MESH_SAR_RX_SEG_THRESHOLD=0x01
CONFIG_BT_MESH_SAR_RX_ACK_RETRANS_COUNT=0x03
CONFIG_BT_MESH_SAR_RX_DISCARD_TIMEOUT=0x0a

# Wiecej buforow adv: LPN musi jednoczesnie odbierac segmenty i ODSYLAC ACK.
CONFIG_BT_MESH_ADV_BUF_COUNT=16

# Wieksza redundancja warstwy sieci: kazdy PDU (segment i ACK) nadawany wiecej
# razy -> mniejsza szansa zgubienia jednego z zaledwie dwoch segmentow.
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=5
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=20

# Optymalizacja energii (WLACZYC DOPIERO PO POTWIERDZENIU DZIALANIA) ---
# DEBUG: serial/console/log tymczasowo WLACZONE, zeby widziec strone LPN.
# Do pomiarow energii przywroc ponizsze na =n i CONFIG_LOG=n na gorze.
# UWAGA: bez LOG_MODE_IMMEDIATE i bez BT_MESH DBG - synchroniczne, gadatliwe
# logi rozwalaly timing provisioningu (PB-ADV). INF + tryb deferred wystarcza.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

CONFIG_BT_MESH_BEACON_ENABLED=n
CONFIG_BT_MESH_GATT_PROXY_ENABLED=n
CONFIG_BT_MESH_LPN_RETRY_TIMEOUT=3
