# Wariant do POMIARU ENERGII: pelny cykl LPN, potem System OFF z pobudka z GRTC.
# Czujnik REALNY (STS4X). Wersja z retencja RAM: -DEXTRA_CONF_FILE=overlay-ret.conf

# Logi i konsola: WYLACZONE (UART i watek logow pobieraja prad)
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
# Board defconfig wymusza RTT_CONSOLE=y - gasimy jawnie (jak w apps/baseline).
CONFIG_RTT_CONSOLE=n
# Potrzebne tylko do drukowania floatow w logach (bt_mesh_sensor_ch_str).
CONFIG_CBPRINTF_FP_SUPPORT=n

# BLE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="LPN Off"
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y

# Mesh: provisioning REALNY - adres i klucze przychodza od Frienda
CONFIG_BT_MESH=y
CONFIG_BT_MESH_PB_ADV=y

# Rola LPN
CONFIG_BT_MESH_LOW_POWER=y
# 600 x 100 ms = 60 s; ta sama wartosc co w apps/lpn, zeby pomiary byly porownywalne.
CONFIG_BT_MESH_LPN_POLL_TIMEOUT=600
CONFIG_BT_MESH_LPN_RETRY_TIMEOUT=3
# Opoznienie Friend Offer liczy Friend jako
# MAX(RECV_WIN_FACTOR * FRIEND_RECV_WIN - RSSI_FACTOR * rssi, 100) ms.
# Przy FRIEND_RECV_WIN=50 i faktorze 1.0 wychodzi ~100 ms, a LPN z
# LPN_ESTABLISHMENT=y ma w tym momencie scanner JESZCZE wylaczony
# (FRIEND_REQ_WAIT = 100 ms w lpn.c). Oferta leci jednym adverem, wiec
# przepada, a kolejna proba to 1,1 s okna + 3 s retry. Faktor 2.0 przesuwa
# oferte na ~140-160 ms, czyli w srodek okna skanowania LPN-a.
# Nie kosztuje energii: LPN i tak skanuje przez cale okno ofert.
CONFIG_BT_MESH_LPN_RECV_WIN_FACTOR=2
# ODWROTNIE niz w apps/lpn: tu friendship nawiazujemy w KAZDYM cyklu, wiec
# zredukowany duty cycle skanowania (domyslne =y) oplaca sie kilkukrotnie.
# Przy =n radio skanuje bez przerwy przez cale okno ofert i przez kazda 3 s przerwe retry.
CONFIG_BT_MESH_LPN_ESTABLISHMENT=y
# Auto-LPN OFF: w tryb LPN wchodzimy recznie, po konfiguracji (patrz main.c).
CONFIG_BT_MESH_LPN_AUTO=n

# Funkcje wymagajace ciagle wlaczonego radia - zbedne dla LPN
CONFIG_BT_MESH_RELAY=n
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_BEACON_ENABLED=n
CONFIG_BT_MESH_GATT_PROXY_ENABLED=n

# Sensor Server: jeden czujnik (temperatura z STS4X)
CONFIG_BT_MESH_SENSOR_SRV=y
CONFIG_BT_MESH_SENSOR_SRV_SENSORS_MAX=1

# Wezel BEZSTANOWY: po restarcie Friend prowizjonuje go od nowa
CONFIG_BT_SETTINGS=n
# Settings/flash zostaja: bez nich blad linkera storage_*_object (PSA ITS na nRF54L).
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# System OFF z pobudka z GRTC - GRTC leci z LFXO, wiec odlicza takze w OFF
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
# Rozpoznanie, czy to zimny start czy pobudka z OFF (RESET_CLOCK)
CONFIG_HWINFO=y

# Blok retencyjny: sterownik jest w OBU wariantach, zeby mapa pamieci byla ta sama.
# Sama retencje w System OFF wlacza dopiero RETAINED_MEM_NRF_RAM_CTRL.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETAINED_MEM_NRF_RAM_CTRL=n
CONFIG_CRC=y

# Stosy i bufory
CONFIG_MAIN_STACK_SIZE=4400
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4800
CONFIG_BT_MESH_RX_SEG_MAX=32
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=3
# Wiecej buforow adv: wezel odbiera segmenty i jednoczesnie odsyla ACK.
CONFIG_BT_MESH_ADV_BUF_COUNT=16

# SAR RX: prog 1, bo AppKey Add ma 2 segmenty a ACK retransmituje sie gdy > prog
CONFIG_BT_MESH_SAR_RX_SEG_THRESHOLD=0x01
# ACK wysylany 4x - pojedynczy zgubiony ACK konczyl konfiguracje bledem -116.
CONFIG_BT_MESH_SAR_RX_ACK_RETRANS_COUNT=0x03
# Dluzszy discard: niekompletny SDU przezywa okno retransmisji Frienda.
CONFIG_BT_MESH_SAR_RX_DISCARD_TIMEOUT=0x0a
# NETWORK_TRANSMIT zostaje DOMYSLNY - podnoszenie go opoznialo ACK i zapychalo adv.

# --- Niezawodnosc provisioningu (PB-ADV) ---
# Domyslnie PDU danych provisioningu leca POJEDYNCZO (retrans=0) - tylko ACK i
# Link Close maja 2 powtorzenia. Na granicznym linku gubi sie ich dosc, ze
# wymiana nie domyka sie przed watchdogiem Frienda. 7 = kazde PDU nadane 8x.
CONFIG_BT_MESH_PB_ADV_TRANS_PDU_RETRANSMIT_COUNT=7
# Beacon nieprovisionowanego co 1 s zamiast co 5 s - Friend znajduje nas szybciej.
CONFIG_BT_MESH_UNPROV_BEACON_INT=1
# Pelna moc nadawania. Domyslne 0 dBm nie wyrabialo na 5 m.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8

# --- Opcjonalny lewar energetyczny (odkomentuj i zmierz) ---
# Publikacja idzie 1x zamiast 3x. Dotyczy tylko Sensor Status - Friend Request
# i Friend Poll i tak leca pojedynczo (POLL_XMIT w lpn.c).
#CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=0
